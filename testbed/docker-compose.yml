version: '3.8'

services:
  edge-broker:
    image: eclipse-mosquitto:2
    container_name: edge-broker
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    ports:
      - "1883:1883"
    networks:
      - cps-network

  plc-sim:
    build: ./plc_sim
    container_name: plc-sim
    depends_on:
      - edge-broker
    networks:
      - cps-network

  cloud-dash:
    build: ./cloud_dash
    container_name: cloud-dash
    depends_on:
      - edge-broker
    networks:
      - cps-network

  attacker:
    build: ./attacker
    container_name: attacker
    networks:
      - cps-network
    # Attacker doesn't start automatically, we run it manually
    profiles: ["manual"]

networks:
  cps-network:
    driver: bridge
